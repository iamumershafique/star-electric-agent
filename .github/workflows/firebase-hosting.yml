name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Serialize production releases; a newer queued main commit replaces an older queued run.
concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    # Never deploy a feature-branch/manual ref to the production site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify production release approval
        env:
          PORTAL_DATA_RELEASE_APPROVED: ${{ vars.PORTAL_DATA_RELEASE_APPROVED }}
        run: |
          if [ "$PORTAL_DATA_RELEASE_APPROVED" != "true" ]; then
            echo "::error::Release blocked: verify backups and production data before setting PORTAL_DATA_RELEASE_APPROVED=true."
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Validate Firebase Web configuration
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
        run: npm run validate:firebase

      - name: Build portal
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Verify this is still the latest main commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          latest="$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)"
          if [ "$latest" != "$TRIGGER_SHA" ]; then
            echo "::error::A newer main commit exists; this older release will not deploy."
            exit 1
          fi

      - name: Deploy Hosting only
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT repository secret before deploying."
            exit 1
          fi
          trap 'rm -f "$RUNNER_TEMP/firebase-service-account.json"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json" \
            npx --no-install firebase deploy --only hosting --project star-agent-jpf --non-interactive
